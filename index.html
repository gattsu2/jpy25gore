<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<meta name="description" content="Plan your week's dinners and generate a shopping list, offline.">
<meta name="theme-color" content="#14141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button id="back-btn" class="back-btn" hidden aria-label="Back">‹</button>
      <h1 id="page-title">Meal Planner</h1>
    </div>
    <button id="install-btn" class="install-btn" hidden>Install app</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="bottom-bar" class="bottom-action-bar" hidden>
    <button id="decide-btn" class="btn primary full-width">Decided!</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
